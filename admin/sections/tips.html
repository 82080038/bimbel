<!-- Tips & Tricks Section -->
<div id="tipsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Tips & Triks</h2>
        <button class="btn btn-success" onclick="showTipsModal()">
            <i class="fas fa-plus"></i> Tambah Tips
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-3">
                <select class="form-select" id="tipsKategoriFilter" onchange="loadTipsTricks()">
                    <option value="">Semua Kategori</option>
                    <!-- Loaded dynamically -->
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Judul</th>
                        <th>Kategori</th>
                        <th>Tipe</th>
                        <th>Prioritas</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="tipsTable">
                    <!-- Tips will be loaded here -->
                </tbody>
            </table>
        </div>
        <nav aria-label="Tips pagination" class="mt-3">
            <ul class="pagination justify-content-center" id="tipsPagination"></ul>
        </nav>
    </div>
</div>
