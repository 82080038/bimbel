<!-- Exam Packages Section -->
<div id="examPackagesSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Paket Tryout</h2>
        <button class="btn btn-primary" onclick="showCreateExamPackageModal()">
            <i class="fas fa-plus"></i> Create Package
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchExamPackage" placeholder="Search packages..." onkeyup="searchExamPackages()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterPackageCategory" onchange="loadExamPackages()">
                    <option value="">All Categories</option>
                    <!-- Loaded dynamically from database -->
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Package Name</th>
                        <th>Category</th>
                        <th>Duration (min)</th>
                        <th>Total Questions</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="examPackagesTable">
                    <tr>
                        <td colspan="8" class="text-center text-muted">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
