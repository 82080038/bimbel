<!-- System Maintenance Section -->
<div id="systemMaintenanceSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>System Maintenance</h2>
        <button class="btn btn-primary" onclick="refreshMaintenanceLog()">
            <i class="fas fa-sync"></i> Refresh Log
        </button>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card p-4">
                <h4><i class="fas fa-database"></i> Database Backup</h4>
                <p class="text-muted">Backup database to SQL file</p>
                <div class="mb-3">
                    <label class="form-label">Backup Name</label>
                    <input type="text" class="form-control" id="backupName" placeholder="backup_2026-05-14">
                </div>
                <button class="btn btn-primary" onclick="createBackup()">
                    <i class="fas fa-download"></i> Create Backup
                </button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4">
                <h4><i class="fas fa-broom"></i> Cleanup Unused Files</h4>
                <p class="text-muted">Remove unused files from uploads and cache</p>
                <div class="mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cleanupUploads" checked>
                        <label class="form-check-label">Cleanup Uploads</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cleanupCache" checked>
                        <label class="form-check-label">Cleanup Cache</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="cleanupLogs" checked>
                        <label class="form-check-label">Cleanup Old Logs</label>
                    </div>
                </div>
                <button class="btn btn-warning" onclick="cleanupFiles()">
                    <i class="fas fa-trash"></i> Cleanup
                </button>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card p-4">
                <h4><i class="fas fa-chart-pie"></i> Storage Analysis</h4>
                <p class="text-muted">Analyze storage usage</p>
                <button class="btn btn-info" onclick="analyzeStorage()">
                    <i class="fas fa-search"></i> Analyze
                </button>
                <div id="storageAnalysisResult" class="mt-3"></div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card p-4">
                <h4><i class="fas fa-sync"></i> System Status</h4>
                <p class="text-muted">Check system health</p>
                <button class="btn btn-success" onclick="checkSystemStatus()">
                    <i class="fas fa-check-circle"></i> Check Status
                </button>
                <div id="systemStatusResult" class="mt-3"></div>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <h4><i class="fas fa-list"></i> Maintenance Log</h4>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Action</th>
                        <th>Status</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="maintenanceLogTable">
                    <tr>
                        <td colspan="4" class="text-center text-muted">No maintenance log entries</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
