<!-- Notifications Section -->
<div id="notificationsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Notifications</h2>
        <button class="btn btn-primary" onclick="refreshNotifications()">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-4">
                <h4><i class="fas fa-bell"></i> Send Notification</h4>
                <form id="sendNotificationForm">
                    <div class="mb-3">
                        <label class="form-label">User</label>
                        <select class="form-select" id="notificationUser" required>
                            <option value="">Select User</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select class="form-select" id="notificationType" required>
                            <option value="in_app">In-App Notification</option>
                            <option value="email">Email Notification</option>
                            <option value="push">Push Notification</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select" id="notificationCategory" required>
                            <option value="system">System</option>
                            <option value="exam_reminder">Exam Reminder</option>
                            <option value="exam_result">Exam Result</option>
                            <option value="achievement">Achievement</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" class="form-control" id="notificationTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" id="notificationMessage" rows="3" required></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="sendNotification()">Send Notification</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-4">
                <h4><i class="fas fa-history"></i> Notification History</h4>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Type</th>
                                <th>Category</th>
                                <th>Title</th>
                                <th>Status</th>
                                <th>Sent At</th>
                            </tr>
                        </thead>
                        <tbody id="notificationsHistoryTable">
                            <tr>
                                <td colspan="6" class="text-center text-muted">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
