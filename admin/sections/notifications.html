<!-- Notifications Section -->
<div id="notificationsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Notifikasi</h2>
        <button class="btn btn-primary" onclick="refreshNotifications()">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-4">
                <h4><i class="fas fa-bell"></i> Kirim Notifikasi</h4>
                <form id="sendNotificationForm">
                    <div class="mb-3">
                        <label class="form-label">User</label>
                        <select class="form-select" id="notificationUser" required>
                            <option value="">Pilih User</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipe</label>
                        <select class="form-select" id="notificationType" required>
                            <option value="in_app">Notifikasi In-App</option>
                            <option value="email">Notifikasi Email</option>
                            <option value="push">Notifikasi Push</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <select class="form-select" id="notificationCategory" required>
                            <option value="system">Sistem</option>
                            <option value="exam_reminder">Pengingat Ujian</option>
                            <option value="exam_result">Hasil Ujian</option>
                            <option value="achievement">Pencapaian</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Judul</label>
                        <input type="text" class="form-control" id="notificationTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pesan</label>
                        <textarea class="form-control" id="notificationMessage" rows="3" required></textarea>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="sendNotification()">Kirim Notifikasi</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-4">
                <h4><i class="fas fa-history"></i> Riwayat Notifikasi</h4>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Tipe</th>
                                <th>Kategori</th>
                                <th>Judul</th>
                                <th>Status</th>
                                <th>Dikirim Pada</th>
                            </tr>
                        </thead>
                        <tbody id="notificationsHistoryTable">
                            <tr>
                                <td colspan="6" class="text-center text-muted">Memuat...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
