<!-- Gamification Tracking Section -->
<div id="gamificationTrackingSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gamification Tracking</h2>
        <button class="btn btn-primary" onclick="refreshGamificationTracking()">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <div class="row mb-4">
        <div class="col-md-12">
            <div class="card p-4">
                <h4><i class="fas fa-gamepad"></i> User Gamification Overview</h4>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Total XP</th>
                                <th>Level</th>
                                <th>Current Streak</th>
                                <th>Longest Streak</th>
                                <th>Badges</th>
                                <th>Achievements</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="gamificationUsersTable">
                            <tr>
                                <td colspan="8" class="text-center text-muted">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
