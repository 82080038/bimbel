<!-- Topics Management Section -->
<div id="topicsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-tags"></i> Manajemen Topik Materi</h2>
        <button class="btn btn-primary" onclick="refreshTopics()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>

    <!-- Category Filter -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Filter Kategori</label>
                    <select class="form-select" id="topicCategoryFilter" onchange="loadTopics()">
                        <option value="">Semua Kategori</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Cari Topik</label>
                    <input type="text" class="form-control" id="searchTopic" placeholder="Cari topik..." onkeyup="searchTopics()">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-success w-100" onclick="reextractTopics()">
                        <i class="fas fa-magic"></i> Re-Extract Topics
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Topics Summary -->
    <div class="row mb-4" id="topicsSummary">
        <!-- Summary cards will be loaded here -->
    </div>

    <!-- Topics Table -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Daftar Topik Materi</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Kategori</th>
                            <th>Nama Topik</th>
                            <th>Keyword</th>
                            <th>Frekuensi</th>
                            <th>Deskripsi</th>
                            <th>Jumlah Soal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="topicsTable">
                        <!-- Topics will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
