<!-- Participants Section -->
<div id="participantsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Partisipan</h2>
        <button class="btn btn-primary" onclick="refreshParticipants()">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchParticipant" placeholder="Search participants..." onkeyup="searchParticipants()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterParticipantStatus" onchange="loadParticipants()">
                    <option value="">All Status</option>
                    <option value="berjalan">In Progress</option>
                    <option value="selesai">Completed</option>
                    <option value="timeout">Timeout</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Participant Name</th>
                        <th>User</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Ability Estimate</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="participantsTable">
                    <tr>
                        <td colspan="9" class="text-center text-muted">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
