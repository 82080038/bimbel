<!-- Questions Section -->
<div id="questionsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manajemen Soal</h2>
        <div>
            <button class="btn btn-secondary me-2" onclick="generateQuestions()">
                <i class="fas fa-robot"></i> AI Generator Soal
            </button>
            <button class="btn btn-primary" onclick="showQuestionModal()">
                <i class="fas fa-plus"></i> Tambah Soal
            </button>
        </div>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-3">
                <select class="form-select" id="filterKategori" onchange="loadQuestions()">
                    <option value="">Semua Kategori</option>
                    <!-- Loaded dynamically -->
                </select>
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchSoal" placeholder="Cari soal..." onkeyup="searchQuestions()">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Kategori</th>
                        <th>Pertanyaan</th>
                        <th>Jawaban</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="questionsTable">
                    <!-- Questions will be loaded here -->
                </tbody>
            </table>
        </div>
        <nav>
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded here -->
            </ul>
        </nav>
    </div>
</div>
