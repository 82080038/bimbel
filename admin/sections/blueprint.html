<!-- Paket Blueprint Section -->
<div id="blueprintSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Paket Blueprint</h2>
        <button class="btn btn-success" onclick="showBlueprintModal()">
            <i class="fas fa-plus"></i> Tambah Blueprint
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-3">
                <select class="form-select" id="blueprintPaketFilter" onchange="loadBlueprints()">
                    <option value="">Semua Paket</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Paket</th>
                        <th>Kategori</th>
                        <th>Target Count</th>
                        <th>Min Difficulty</th>
                        <th>Max Difficulty</th>
                        <th>Available</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="blueprintTable">
                    <!-- Blueprints will be loaded here -->
                </tbody>
            </table>
        </div>
        <nav aria-label="Blueprint pagination" class="mt-3">
            <ul class="pagination justify-content-center" id="blueprintPagination"></ul>
        </nav>
    </div>
</div>
