<!-- Exam Sessions Section -->
<div id="examSessionsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Sesi Ujian</h2>
        <button class="btn btn-primary" onclick="refreshExamSessions()">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchExamSession" placeholder="Cari sesi..." onkeyup="searchExamSessions()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterSessionStatus" onchange="loadExamSessions()">
                    <option value="">Semua Status</option>
                    <option value="in_progress">Sedang Berjalan</option>
                    <option value="completed">Selesai</option>
                    <option value="abandoned">Dibatalkan</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Paket</th>
                        <th>Waktu Mulai</th>
                        <th>Waktu Selesai</th>
                        <th>Status</th>
                        <th>Nilai</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="examSessionsTable">
                    <tr>
                        <td colspan="8" class="text-center text-muted">Memuat...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
