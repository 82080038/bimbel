<!-- Exam Sessions Section -->
<div id="examSessionsSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Sesi Ujian</h2>
        <button class="btn btn-primary" onclick="refreshExamSessions()">
            <i class="fas fa-sync"></i> Refresh
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchExamSession" placeholder="Search sessions..." onkeyup="searchExamSessions()">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="filterSessionStatus" onchange="loadExamSessions()">
                    <option value="">All Status</option>
                    <option value="in_progress">In Progress</option>
                    <option value="completed">Completed</option>
                    <option value="abandoned">Abandoned</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>User</th>
                        <th>Package</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Status</th>
                        <th>Score</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="examSessionsTable">
                    <tr>
                        <td colspan="8" class="text-center text-muted">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
