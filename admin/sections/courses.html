<!-- Course Management Section -->
<div id="courseManagementSection" class="hidden">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Course Management</h2>
        <button class="btn btn-primary" onclick="showCreateCourseModal()">
            <i class="fas fa-plus"></i> Create Course
        </button>
    </div>
    
    <div class="card p-3 mb-3">
        <div class="row">
            <div class="col-md-3">
                <select class="form-select" id="filterCourseCategory" onchange="loadCourses()">
                    <option value="">Semua Kategori</option>
                    <!-- Loaded dynamically -->
                </select>
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control" id="searchCourse" placeholder="Cari course..." onkeyup="searchCourses()">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Judul</th>
                        <th>Kategori</th>
                        <th>Modules</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="coursesTable">
                    <tr>
                        <td colspan="6" class="text-center text-muted">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
