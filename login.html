<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Ujian Sekolah Kedinasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: #1e40af;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #6b7280;
        }
        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #1e40af, #3b82f6);
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(30, 64, 175, 0.3);
        }
        .alert {
            border-radius: 10px;
            display: none;
        }
        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }
        .back-link a {
            color: #1e40af;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }

        /* Responsive adjustments for Bootstrap components */
        @media (max-width: 576px) {
            /* Toast container - move to top on mobile to avoid covering content */
            .toast-container.position-fixed.bottom-0.end-0 {
                bottom: auto !important;
                top: 1rem !important;
                right: 0.5rem !important;
                left: 0.5rem !important;
            }
            
            /* Ensure modals are full width on very small screens */
            .modal-dialog {
                margin: 0.5rem;
            }
            
            .modal-dialog-centered {
                min-height: calc(100% - 1rem);
            }
            
            /* Adjust modal content padding on mobile */
            .modal-content {
                border-radius: 0.5rem;
            }
            
            .modal-body {
                padding: 1rem;
            }
            
            .modal-footer {
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
            }
            
            .modal-footer .btn {
                flex: 1;
                margin: 0.25rem 0;
            }
        }
        
        @media (min-width: 576px) and (max-width: 768px) {
            .toast-container.position-fixed.bottom-0.end-0 {
                right: 1rem !important;
            }
        }
        
        /* Ensure toasts have high z-index */
        .toast-container {
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1><i class="fas fa-graduation-cap"></i> Ujian Kedinasan</h1>
            <p>Silakan login untuk melanjutkan</p>
        </div>

        <div id="alertBox" class="alert" role="alert"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required placeholder="Masukkan username">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn btn-login">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <!-- Quick Login Buttons untuk Testing -->
        <div class="quick-login-section" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb;">
            <p class="text-center text-muted mb-2" style="font-size: 0.85rem;">
                <i class="fas fa-bolt"></i> Quick Login (Testing)
            </p>
            <div class="d-grid gap-2">
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="quickLogin('fresh_user_11778919457', 'simulasi123')">
                    <i class="fas fa-user"></i> User 1 (TWK)
                </button>
                <button type="button" class="btn btn-outline-primary btn-sm" onclick="quickLogin('fresh_user_21778919457', 'simulasi123')">
                    <i class="fas fa-user"></i> User 2 (TIU)
                </button>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="quickLogin('admin', 'admin123')">
                    <i class="fas fa-user-shield"></i> Admin
                </button>
            </div>
        </div>

        <div class="login-link mt-3">
            <p class="mb-1">Belum punya akun? <a href="register.html"><i class="fas fa-user-plus"></i> Daftar di sini</a></p>
            <p><a href="index.html"><i class="fas fa-home"></i> Kembali ke Beranda</a></p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/rbac.js"></script>
    <script>
        // Use AppConfig for all URLs - automatically handles base URL
        const API_BASE = AppConfig.API_URL;

        // Check if already logged in
        const currentRole = localStorage.getItem('userRole');
        const authToken = localStorage.getItem('authToken');

        if (authToken && currentRole) {
            // Already logged in, redirect based on role
            if (currentRole === 'admin') {
                window.location.href = 'admin/admin.html';
            } else {
                window.location.href = 'participant/dashboard.html';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Show loading
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/auth.php?action=login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success && data.user) {
                    // Use api_key as token (or token if provided)
                    const token = data.token || data.user.api_key;
                    
                    // Store login data using RBAC
                    RBAC.storeLoginData(token, data.user.role, data.user);
                    
                    const roleDisplay = data.user.role === 'admin' ? 'Administrator' : 'Peserta';
                    showAlert(`Login berhasil! Selamat datang ${roleDisplay}...`, 'success');
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = 'admin/admin.html';
                        } else {
                            // Peserta goes to dashboard
                            window.location.href = 'participant/dashboard.html';
                        }
                    }, 1500);
                } else {
                    showAlert(data.error || 'Login gagal. Periksa username dan password.', 'danger');
                    btn.innerHTML = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Terjadi kesalahan koneksi. Silakan coba lagi.', 'danger');
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // Quick Login Function untuk Testing
        function quickLogin(username, password) {
            console.log(`Quick Login: ${username}`);
            
            // Fill username and password
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
            
            // Trigger input events untuk validasi form
            document.getElementById('username').dispatchEvent(new Event('input', { bubbles: true }));
            document.getElementById('password').dispatchEvent(new Event('input', { bubbles: true }));
            
            // Auto submit form
            document.getElementById('loginForm').dispatchEvent(new Event('submit', { bubbles: true }));
            
            console.log(`Auto-login triggered for: ${username}`);
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.style.display = 'block';

            // Auto-hide success messages
            if (type === 'success') {
                setTimeout(() => {
                    alertBox.style.display = 'none';
                }, 5000);
            }
        }

        // Toast Notification Helper
        function showToast(message, type = 'success', duration = 3000) {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) return;

            const toastId = 'toast_' + Date.now();
            const typeMap = {
                'success': { bg: 'text-success', icon: 'fa-check-circle' },
                'error': { bg: 'text-danger', icon: 'fa-times-circle' },
                'warning': { bg: 'text-warning', icon: 'fa-exclamation-triangle' },
                'info': { bg: 'text-info', icon: 'fa-info-circle' }
            };

            const toastHTML = `
                <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto ${typeMap[type].bg}">
                            <i class="fas ${typeMap[type].icon}"></i> ${type.charAt(0).toUpperCase() + type.slice(1)}
                        </strong>
                        <small>Just now</small>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;

            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            const toastEl = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastEl, { delay: duration });
            toast.show();

            toastEl.addEventListener('hidden.bs.toast', () => {
                toastEl.remove();
            });
        }

        // Confirm Modal Helper
        let confirmCallback = null;

        function showConfirm(message, onConfirm, onCancel = null) {
            const modalTitle = document.querySelector('#confirmModal .modal-title');
            const modalMessage = document.getElementById('confirmModalMessage');
            const okButton = document.getElementById('confirmModalOK');

            modalTitle.textContent = 'Konfirmasi';
            modalMessage.innerHTML = `<i class="fas fa-exclamation-triangle text-warning me-2"></i> ${message}`;

            confirmCallback = onConfirm;

            okButton.onclick = () => {
                if (confirmCallback) confirmCallback();
                bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
            };

            const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
            modal.show();

            modal._element.addEventListener('hidden.bs.modal', function handler() {
                if (onCancel) onCancel();
                modal._element.removeEventListener('hidden.bs.modal', handler);
            }, { once: true });
        }

        // Loading Modal Helper
        let loadingModalInstance = null;

        function showLoading(message = 'Memuat...') {
            document.getElementById('loadingModalMessage').textContent = message;
            loadingModalInstance = new bootstrap.Modal(document.getElementById('loadingModal'), {
                backdrop: 'static',
                keyboard: false
            });
            loadingModalInstance.show();
            return loadingModalInstance;
        }

        function hideLoading() {
            if (loadingModalInstance) {
                loadingModalInstance.hide();
                loadingModalInstance = null;
            }
        }
    </script>

    <!-- Confirm Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Konfirmasi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <div id="confirmModalMessage" role="alert" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Batal">Batal</button>
                    <button type="button" class="btn btn-primary" id="confirmModalOK" aria-label="Konfirmasi">Ya</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4">
                <div class="spinner-border text-primary" role="status" aria-live="polite">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 mb-0" id="loadingModalMessage" aria-live="polite">Memuat...</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">
        <!-- Toasts will be dynamically added here -->
    </div>
</body>
</html>
