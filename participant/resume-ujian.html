<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Ujian - Ujian Sekolah Kedinasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/participant.css">
</head>
<body>
    <div class="dashboard-container" role="main" aria-label="Hasil Ujian">
        <!-- Header -->
        <div class="dashboard-header" role="banner">
            <div class="user-welcome">
                <div class="user-avatar" id="userAvatar" aria-label="Avatar pengguna">-</div>
                <div class="user-info">
                    <h3 id="userName" aria-live="polite">Loading...</h3>
                    <p id="userDetail" aria-live="polite">Loading...</p>
                </div>
            </div>
            <div class="quick-actions">
                <button class="btn-quick btn-secondary-custom" onclick="goToDashboard()" aria-label="Kembali ke dashboard">
                    <i class="fas fa-home" aria-hidden="true"></i> Dashboard
                </button>
                <button class="btn-quick btn-primary-custom" onclick="retakeExam()" aria-label="Ujian lagi">
                    <i class="fas fa-redo" aria-hidden="true"></i> Ujian Lagi
                </button>
                <button class="btn-quick btn-danger-custom" onclick="logout()" aria-label="Logout">
                    <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="examResultContent">
            <!-- Content will be loaded dynamically -->
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3">Memuat hasil ujian...</p>
            </div>
        </div>

        <!-- Modals Container -->
        <div id="modalsContainer"></div>

        <!-- Toast Container -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">
            <!-- Toasts will be dynamically added here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/rbac.js"></script>
    <script src="../js/number-formatter.js"></script>
    <script src="js/pembahasan-helper.js"></script>
    <script src="js/resume-ujian.js"></script>
    <script src="expert_assistant.js"></script>
</body>
</html>
