<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Ujian Sekolah Kedinasan</title>
    <meta name="description" content="Sistem Seleksi Kompetensi Dasar (SKD) untuk sekolah kedinasan">
    <meta name="theme-color" content="#1e40af">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Ujian Kedinasan">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/svg+xml" href="../icon-192.svg">
    <link rel="apple-touch-icon" href="../icon-192.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/ujian.css">
</head>
<body>
    <div class="exam-container">
        <!-- Exam Content -->
        <div id="examContent"></div>

        <!-- Modals -->
        <div id="modalsContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/rbac.js"></script>
    <script src="../js/number-formatter.js"></script>
    <script src="js/session-manager.js"></script>
    <script src="js/ujian.js"></script>
    <script>
        // Load exam content and modals
        async function loadExamComponents() {
            try {
                const contentResponse = await fetch('sections/ujian-content.html');
                const contentHTML = await contentResponse.text();
                document.getElementById('examContent').innerHTML = contentHTML;

                const modalsResponse = await fetch('components/modals-shared.html');
                const modalsHTML = await modalsResponse.text();
                document.getElementById('modalsContainer').innerHTML = modalsHTML;

                // Init UI that depends on injected DOM elements
                if (typeof initUIAfterLoad === 'function') {
                    initUIAfterLoad();
                }
                
                // Handle URL parameter after content is loaded
                const urlParams = new URLSearchParams(window.location.search);
                const action = urlParams.get('action');
                
                if (action === 'history' && typeof showHistoryScreenWithRetry === 'function') {
                    showHistoryScreenWithRetry();
                }
            } catch (error) {
                console.error('Error loading exam components:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadExamComponents();
        });
    </script>
</body>
</html>
