    <a href="dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i> Kembali
    </a>

    <div class="container">
        <div class="main-container">
            <!-- Header -->
            <div class="header-section">
                <h1><i class="fas fa-medal"></i> Pencapaian</h1>
                <p>Lencana dan pencapaian Anda</p>
            </div>

        <!-- Stats Overview -->
        <div class="stats-section">
            <div class="row">
                <div class="col-md-3">
                    <div class="stat-card">
                        <i class="fas fa-trophy fa-2x"></i>
                        <h3 id="totalBadges">0</h3>
                        <p>Total Lencana</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <i class="fas fa-star fa-2x"></i>
                        <h3 id="completedAchievements">0</h3>
                        <p>Selesai</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <i class="fas fa-lock fa-2x"></i>
                        <h3 id="lockedAchievements">0</h3>
                        <p>Terkunci</p>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card">
                        <i class="fas fa-percentage fa-2x"></i>
                        <h3 id="completionPercentage">0%</h3>
                        <p>Perkembangan</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Achievement Categories -->
        <div class="categories-section">
            <div class="row">
                <div class="col-md-12">
                    <div class="category-tabs">
                        <button class="btn active" onclick="filterAchievements('all')">Semua</button>
                        <button class="btn" onclick="filterAchievements('exam')">Ujian</button>
                        <button class="btn" onclick="filterAchievements('streak')">Berturut-turut</button>
                        <button class="btn" onclick="filterAchievements('learning')">Belajar</button>
                        <button class="btn" onclick="filterAchievements('special')">Spesial</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Achievements Grid -->
        <div class="achievements-grid" id="achievementsGrid">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Memuat...</span>
                </div>
                <p class="mt-2">Memuat pencapaian...</p>
            </div>
        </div>

        <!-- Pencapaian Terbaru -->
        <div class="recent-section">
            <h3><i class="fas fa-clock me-2"></i>Pencapaian Terbaru</h3>
            <div class="card">
                <div class="card-body">
                    <div id="recentAchievements">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Memuat...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
