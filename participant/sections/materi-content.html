    <a href="dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="materi-container">
        <!-- Header -->
        <div class="header-section">
            <h1 class="mb-3">
                <i class="fas fa-book" style="color: var(--primary-color);"></i>
                Bahan Ajar
            </h1>
            <p class="text-muted">Akses materi belajar untuk meningkatkan pemahaman Anda</p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Kategori</label>
                    <select class="form-select" id="filterKategori" onchange="filterMaterials()">
                        <option value="">Semua Kategori</option>
                        <!-- Loaded dynamically from API -->
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipe</label>
                    <select class="form-select" id="filterTipe" onchange="filterMaterials()">
                        <option value="">Semua Tipe</option>
                        <option value="pdf">PDF</option>
                        <option value="video">Video</option>
                        <option value="text">Teks</option>
                        <option value="link">Link Eksternal</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Cari</label>
                    <input type="text" class="form-control" id="searchMaterials" placeholder="Cari bahan ajar..." onkeyup="filterMaterials()">
                </div>
            </div>
        </div>

        <!-- Comprehensive Learning Materials Section -->
        <div class="comprehensive-materials-section mb-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">
                        <i class="fas fa-book-open me-2"></i>
                        Materi Penting untuk Dipelajari
                    </h5>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-3">Berikut adalah materi-materi penting yang tersedia di aplikasi ini untuk membantu Anda mempersiapkan ujian:</p>
                    <div id="comprehensiveMaterialsAccordion" class="accordion">
                        <!-- Comprehensive materials will be loaded here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Materials Grid -->
        <div id="materialsGrid" class="row">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Memuat...</span>
                </div>
                <p class="mt-3 text-muted">Memuat bahan ajar...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/number-formatter.js"></script>
    <script>
        // Load comprehensive learning materials
        async function loadComprehensiveMaterials() {
            try {
                const response = await fetch('../data/learning_materials/comprehensive_materials_summary.json');
                const data = await response.json();
                
                const accordion = document.getElementById('comprehensiveMaterialsAccordion');
                accordion.innerHTML = '';
                
                data.categories.forEach((category, index) => {
                    const itemId = `collapse${index}`;
                    accordion.innerHTML += `
                        <div class="accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" type="button" data-bs-toggle="collapse" data-bs-target="#${itemId}">
                                    <i class="${category.icon} me-2"></i>
                                    ${category.nama} (${category.kode})
                                </button>
                            </h2>
                            <div id="${itemId}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}" data-bs-parent="#comprehensiveMaterialsAccordion">
                                <div class="accordion-body">
                                    <p class="text-muted mb-3">${category.deskripsi}</p>
                                    <h6 class="fw-bold mb-2">Materi yang tersedia:</h6>
                                    <ul class="list-group list-group-flush">
                                        ${category.materi.map(materi => `
                                            <li class="list-group-item">
                                                <i class="fas fa-check-circle text-success me-2"></i>
                                                <strong>${materi}</strong>
                                            </li>
                                        `).join('')}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading comprehensive materials:', error);
                document.getElementById('comprehensiveMaterialsAccordion').innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Gagal memuat materi komprehensif
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadComprehensiveMaterials();
        });
    </script>
