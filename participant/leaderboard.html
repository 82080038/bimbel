<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Ujian Sekolah Kedinasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/leaderboard.css">
</head>
<body>
    <div class="leaderboard-container">
        <!-- Leaderboard Content -->
        <div id="leaderboardContent"></div>

        <!-- Modals -->
        <div id="modalsContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/rbac.js"></script>
    <script src="js/leaderboard.js"></script>
    <script>
        // Load leaderboard content and modals
        async function loadLeaderboardComponents() {
            try {
                const contentResponse = await fetch('sections/leaderboard-content.html');
                const contentHTML = await contentResponse.text();
                document.getElementById('leaderboardContent').innerHTML = contentHTML;

                const modalsResponse = await fetch('components/modals-shared.html');
                const modalsHTML = await modalsResponse.text();
                document.getElementById('modalsContainer').innerHTML = modalsHTML;
            } catch (error) {
                console.error('Error loading leaderboard components:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadLeaderboardComponents();
        });
    </script>
</body>
</html>
