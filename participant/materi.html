<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bahan Ajar - Ujian Sekolah Kedinasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1e40af;
            --secondary-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --info-color: #06b6d4;
            --dark-color: #1f2937;
            --light-color: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .materi-container {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            color: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .materi-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }

        .materi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .materi-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            margin-bottom: 1rem;
        }

        .materi-icon.pdf {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .materi-icon.video {
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .materi-icon.text {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
        }

        .materi-icon.link {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .progress-indicator {
            height: 6px;
            border-radius: 3px;
            background: #e5e7eb;
            margin-top: 1rem;
        }

        .progress-bar-custom {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            transition: width 0.3s ease;
        }

        .badge-category {
            background: var(--light-color);
            color: var(--dark-color);
            padding: 0.25rem 0.75rem;
            border-radius: 10px;
            font-size: 0.875rem;
        }

        @media (max-width: 768px) {
            .materi-container {
                padding: 1rem;
            }

            .header-section, .filter-section, .materi-card {
                padding: 1rem;
            }
        }

        @media (max-width: 576px) {
            /* Toast container - move to top on mobile to avoid covering content */
            .toast-container.position-fixed.bottom-0.end-0 {
                bottom: auto !important;
                top: 1rem !important;
                right: 0.5rem !important;
                left: 0.5rem !important;
            }
            
            /* Ensure modals are full width on very small screens */
            .modal-dialog {
                margin: 0.5rem;
            }
            
            .modal-dialog-centered {
                min-height: calc(100% - 1rem);
            }
            
            /* Adjust modal content padding on mobile */
            .modal-content {
                border-radius: 0.5rem;
            }
            
            .modal-body {
                padding: 1rem;
            }
            
            .modal-footer {
                padding: 0.75rem 1rem;
                flex-wrap: wrap;
            }
            
            .modal-footer .btn {
                flex: 1;
                margin: 0.25rem 0;
            }
        }
        
        @media (min-width: 576px) and (max-width: 768px) {
            .toast-container.position-fixed.bottom-0.end-0 {
                right: 1rem !important;
            }
        }
        
        /* Ensure toasts have high z-index */
        .toast-container {
            z-index: 9999;
        }
    </style>
</head>
<body>
    <a href="dashboard.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="materi-container">
        <!-- Header -->
        <div class="header-section">
            <h1 class="mb-3">
                <i class="fas fa-book" style="color: var(--primary-color);"></i>
                Bahan Ajar
            </h1>
            <p class="text-muted">Akses materi belajar untuk meningkatkan pemahaman Anda</p>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Kategori</label>
                    <select class="form-select" id="filterKategori" onchange="filterMaterials()">
                        <option value="">Semua Kategori</option>
                        <!-- Loaded dynamically from API -->
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipe</label>
                    <select class="form-select" id="filterTipe" onchange="filterMaterials()">
                        <option value="">Semua Tipe</option>
                        <option value="pdf">PDF</option>
                        <option value="video">Video</option>
                        <option value="text">Teks</option>
                        <option value="link">Link Eksternal</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Cari</label>
                    <input type="text" class="form-control" id="searchMaterials" placeholder="Cari bahan ajar..." onkeyup="filterMaterials()">
                </div>
            </div>
        </div>

        <!-- Materials Grid -->
        <div id="materialsGrid" class="row">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 text-muted">Memuat bahan ajar...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/number-formatter.js"></script>
    <script>
        const API_BASE = '../api';
        let authToken = '';
        let allMaterials = [];

        // Load auth token
        function loadAuthToken() {
            authToken = localStorage.getItem('authToken') || '';
            if (!authToken) {
                window.location.href = '../login.html';
                return false;
            }
            return true;
        }

        // Load materials
        async function loadMaterials() {
            try {
                const response = await fetch(`${API_BASE}/soal.php?action=get_all_bahan_pelajaran`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                const data = await response.json();
                
                if (data.success && data.data) {
                    allMaterials = data.data;
                    displayMaterials(allMaterials);
                } else {
                    displayEmptyState();
                }
            } catch (error) {
                console.error('Error loading materials:', error);
                displayErrorState();
            }
        }

        // Display materials
        function displayMaterials(materials) {
            const grid = document.getElementById('materialsGrid');
            
            if (!materials || materials.length === 0) {
                displayEmptyState();
                return;
            }

            grid.innerHTML = materials.map(material => {
                const iconClass = material.jenis_file === 'pdf' ? 'pdf' : 
                                 material.jenis_file === 'video' ? 'video' : 
                                 material.tipe === 'link' ? 'link' : 'text';
                const progress = material.progress || 0;
                
                return `
                    <div class="col-md-6 col-lg-4 mb-4">
                        <div class="materi-card h-100">
                            <div class="materi-icon ${iconClass}">
                                <i class="fas fa-${material.jenis_file === 'pdf' ? 'file-pdf' : 
                                               material.jenis_file === 'video' ? 'play-circle' : 
                                               material.tipe === 'link' ? 'link' : 'file-alt'}"></i>
                            </div>
                            <h5 class="mb-2">${material.judul || 'Tanpa Judul'}</h5>
                            <p class="text-muted small mb-3">${material.deskripsi || 'Tidak ada deskripsi'}</p>
                            <div class="mb-3">
                                <span class="badge badge-category">${material.kategori || 'Umum'}</span>
                                <span class="badge badge-category ms-1">${material.tipe || 'Umum'}</span>
                            </div>
                            <div class="progress-indicator">
                                <div class="progress-bar-custom" style="width: ${progress}%;"></div>
                            </div>
                            <div class="d-flex justify-content-between mt-2">
                                <small class="text-muted">${progress}% selesai</small>
                                <a href="${material.file_path || material.url || '#'}" target="_blank" class="btn btn-sm btn-primary">
                                    <i class="fas fa-external-link-alt"></i> Buka
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Display empty state
        function displayEmptyState() {
            const grid = document.getElementById('materialsGrid');
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fas fa-book fa-4x mb-3 text-muted"></i>
                    <h4 class="text-muted">Belum ada bahan ajar</h4>
                    <p class="text-muted">Bahan ajar akan ditambahkan sesuai kebutuhan belajar Anda</p>
                </div>
            `;
        }

        // Display error state
        function displayErrorState() {
            const grid = document.getElementById('materialsGrid');
            grid.innerHTML = `
                <div class="col-12 text-center py-5">
                    <i class="fas fa-exclamation-triangle fa-4x mb-3 text-warning"></i>
                    <h4 class="text-muted">Gagal memuat bahan ajar</h4>
                    <p class="text-muted">Silakan refresh halaman untuk mencoba lagi</p>
                    <button class="btn btn-primary mt-2" onclick="loadMaterials()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            `;
        }

        // Filter materials
        function filterMaterials() {
            const kategori = document.getElementById('filterKategori').value;
            const tipe = document.getElementById('filterTipe').value;
            const search = document.getElementById('searchMaterials').value.toLowerCase();

            let filtered = allMaterials;

            if (kategori) {
                filtered = filtered.filter(m => m.kategori === kategori);
            }

            if (tipe) {
                filtered = filtered.filter(m => m.tipe === tipe);
            }

            if (search) {
                filtered = filtered.filter(m => 
                    (m.judul && m.judul.toLowerCase().includes(search)) ||
                    (m.deskripsi && m.deskripsi.toLowerCase().includes(search))
                );
            }

            displayMaterials(filtered);
        }

        // Load categories for filter
        async function loadKategori() {
            try {
                const response = await fetch('../api/soal.php?action=get_kategori', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken')}` }
                });
                const data = await response.json();
                
                const select = document.getElementById('filterKategori');
                if (data.success && data.data.length > 0) {
                    select.innerHTML = '<option value="">Semua Kategori</option>';
                    
                    data.data.forEach(kat => {
                        const option = document.createElement('option');
                        option.value = kat.nama;
                        option.textContent = kat.nama;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading kategori:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (loadAuthToken()) {
                loadKategori();
                loadMaterials();
            }
        });

        // Toast Notification Helper
        function showToast(message, type = 'success', duration = 3000) {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) return;

            const toastId = 'toast_' + Date.now();
            const typeMap = {
                'success': { bg: 'text-success', icon: 'fa-check-circle' },
                'error': { bg: 'text-danger', icon: 'fa-times-circle' },
                'warning': { bg: 'text-warning', icon: 'fa-exclamation-triangle' },
                'info': { bg: 'text-info', icon: 'fa-info-circle' }
            };

            const toastHTML = `
                <div id="${toastId}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
                    <div class="toast-header">
                        <strong class="me-auto ${typeMap[type].bg}">
                            <i class="fas ${typeMap[type].icon}"></i> ${type.charAt(0).toUpperCase() + type.slice(1)}
                        </strong>
                        <small>Just now</small>
                        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;

            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            const toastEl = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastEl, { delay: duration });
            toast.show();

            toastEl.addEventListener('hidden.bs.toast', () => {
                toastEl.remove();
            });
        }

        // Confirm Modal Helper
        let confirmCallback = null;

        function showConfirm(message, onConfirm, onCancel = null) {
            const modalTitle = document.querySelector('#confirmModal .modal-title');
            const modalMessage = document.getElementById('confirmModalMessage');
            const okButton = document.getElementById('confirmModalOK');

            modalTitle.textContent = 'Konfirmasi';
            modalMessage.innerHTML = `<i class="fas fa-exclamation-triangle text-warning me-2"></i> ${message}`;

            confirmCallback = onConfirm;

            okButton.onclick = () => {
                if (confirmCallback) confirmCallback();
                bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
            };

            const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
            modal.show();

            modal._element.addEventListener('hidden.bs.modal', function handler() {
                if (onCancel) onCancel();
                modal._element.removeEventListener('hidden.bs.modal', handler);
            }, { once: true });
        }

        // Loading Modal Helper
        let loadingModalInstance = null;

        function showLoading(message = 'Memuat...') {
            document.getElementById('loadingModalMessage').textContent = message;
            loadingModalInstance = new bootstrap.Modal(document.getElementById('loadingModal'), {
                backdrop: 'static',
                keyboard: false
            });
            loadingModalInstance.show();
            return loadingModalInstance;
        }

        function hideLoading() {
            if (loadingModalInstance) {
                loadingModalInstance.hide();
                loadingModalInstance = null;
            }
        }
    </script>

    <!-- Confirm Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Konfirmasi</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
                </div>
                <div class="modal-body">
                    <div id="confirmModalMessage" role="alert" aria-live="polite"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Batal">Batal</button>
                    <button type="button" class="btn btn-primary" id="confirmModalOK" aria-label="Konfirmasi">Ya</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->
    <div class="modal fade" id="loadingModal" tabindex="-1" aria-labelledby="loadingModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4">
                <div class="spinner-border text-primary" role="status" aria-live="polite">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-3 mb-0" id="loadingModalMessage" aria-live="polite">Memuat...</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">
        <!-- Toasts will be dynamically added here -->
    </div>
</body>
</html>
