<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Peserta - Ujian Sekolah Kedinasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/participant.css">
</head>
<body>
    <div class="dashboard-container" role="main" aria-label="Dashboard Peserta">
        <!-- Dashboard Content -->
        <div id="dashboardContent"></div>

        <!-- Modals -->
        <div id="modalsContainer"></div>

        <!-- Toast Container -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer">
            <!-- Toasts will be dynamically added here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/rbac.js"></script>
    <script src="../js/number-formatter.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="expert_assistant.js"></script>
    <script>
        // Load dashboard content and modals
        async function loadDashboardComponents() {
            try {
                const contentResponse = await fetch('sections/dashboard-content.html');
                const contentHTML = await contentResponse.text();
                document.getElementById('dashboardContent').innerHTML = contentHTML;

                const modalsResponse = await fetch('components/modals.html');
                const modalsHTML = await modalsResponse.text();
                document.getElementById('modalsContainer').innerHTML = modalsHTML;
            } catch (error) {
                console.error('Error loading dashboard components:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardComponents();
        });
    </script>
</body>
</html>
