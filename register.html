<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi - Ujian Sekolah Kedinasan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="register-container">
        <!-- Register Content -->
        <div id="registerContent"></div>

        <!-- Modals -->
        <div id="modalsContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/rbac.js"></script>
    <script>
        // Load register content and modals
        async function loadRegisterComponents() {
            try {
                const contentResponse = await fetch('sections/register-content.html');
                const contentHTML = await contentResponse.text();
                document.getElementById('registerContent').innerHTML = contentHTML;

                const modalsResponse = await fetch('components/modals-shared.html');
                const modalsHTML = await modalsResponse.text();
                document.getElementById('modalsContainer').innerHTML = modalsHTML;

                // Load register.js AFTER content is injected so event listeners attach correctly
                const script = document.createElement('script');
                script.src = 'js/register.js';
                document.body.appendChild(script);
            } catch (error) {
                console.error('Error loading register components:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadRegisterComponents();
        });
    </script>
</body>
</html>
